<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piiri – Valokuvia Seinäjoelta</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      background-color: #11161d;
      background-image: linear-gradient(rgba(10, 14, 20, 0.45), rgba(10, 14, 20, 0.72)), url('taustakuva1.jpg');
      background-size: cover; background-position: center; background-attachment: fixed;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .saa-laatikko, .paiva-palkki {
      position: fixed; top: 18px; background: rgba(15, 20, 28, 0.6); backdrop-filter: blur(8px);
      padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; color: #f1f5f9; border: 1px solid rgba(255, 255, 255, 0.15); z-index: 10;
    }
    .saa-laatikko { left: 24px; display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .paiva-palkki { right: 24px; }
    .etusivu-sisalto { max-width: 760px; text-align: center; padding: 20px; }
    h1 { font-size: 4rem; font-weight: 700; letter-spacing: 4px; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.85); }
    .esittely { font-size: 1.15rem; line-height: 1.75; margin-bottom: 36px; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9); }
    .nappi { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; border: none; padding: 13px 30px; font-size: 1rem; font-weight: 600; border-radius: 30px; cursor: pointer; }
    .modal-tausta { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 100; align-items: center; justify-content: center; }
    .modal-tausta.avoin { display: flex; }
    .modal-ikkuna { background: #1e2530; border-radius: 18px; max-width: 480px; width: 100%; padding: 30px; position: relative; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 10px; background: rgba(15,20,28,0.8); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <a href="https://foreca.fi" target="_blank" class="saa-laatikko">
    <span id="saaIkoni">🌦️</span>
    <div><div id="saaLampo">Seinäjoki</div><div id="saaTeksti" style="font-size:0.8rem;color:#cbd5e1;">Ladataan...</div></div>
  </a>
  <div class="paiva-palkki" id="paivaNaytto"></div>
  <main class="etusivu-sisalto">
    <h1>Piiri</h1>
    <p class="esittely">Tältä sivustolta löytyy enimmäkseen valokuvia uudenkarhealla järjestelmäkameralla Canon EOS 1100D (2011) otettuja ja ihan kännykälläkin räpsimisiä...</p>
    <button class="nappi" onclick="document.getElementById('yhteysModal').classList.add('avoin')">Ota yhteyttä</button>
  </main>
  <div class="modal-tausta" id="yhteysModal">
    <div class="modal-ikkuna">
      <button style="position:absolute;top:15px;right:18px;background:none;border:none;color:#fff;font-size:1.5rem;" onclick="document.getElementById('yhteysModal').classList.remove('avoin')">&times;</button>
      <h2>Ota yhteyttä</h2>
      <form id="yhteysLomake">
        <input type="text" placeholder="Etunimi" required>
        <input type="email" placeholder="Sähköposti" required>
        <textarea placeholder="Viestisi" required></textarea>
        <button type="submit" class="nappi" style="width:100%;">Lähetä</button>
      </form>
    </div>
  </div>
  <script>
    // Päivämäärä ja nimipäivät
    const nyt = new Date();
    const pvm = `${nyt.getDate()}.${nyt.getMonth() + 1}.${nyt.getFullYear()}`;
    const viikonpaivat = ['sunnuntai', 'maanantai', 'tiistai', 'keskiviikko', 'torstai', 'perjantai', 'lauantai'];
    const nimipaivat = { "18.11.": "Jousia, Max, Tenho", "19.11.": "Liisa, Eliisa", "20.11.": "Jalmari, Jari" };
    document.getElementById('paivaNaytto').textContent = `${viikonpaivat[nyt.getDay()]} ${pvm} ${nimipaivat[`${nyt.getDate()}.${nyt.getMonth()+1}.`] || ''}`;

    // Säädata Open-Meteo-rajapinnasta
    async function haeSaa() {
      try {
        const res = await fetch('https://open-meteo.com');
        const data = await res.json();
        const lampo = Math.round(data.current.temperature_2m);
        document.getElementById('saaLampo').textContent = `Seinäjoki ${lampo > 0 ? '+' : ''}${lampo}°C`;
        document.getElementById('saaTeksti').textContent = 'Sääohjeiden mukainen';
      } catch (e) {
        document.getElementById('saaTeksti').textContent = 'Ei saatavilla';
      }
    }
    haeSaa();
  </script>
</body>
</html>
